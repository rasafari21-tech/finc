<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>finc · prueba</title>
<meta name="theme-color" content="#f2f3f6">
<style>
/* finc — hoja de estilo unica.

   Movil primero. Todo control interactivo vive por debajo del 55 % de la
   altura de pantalla: la cabecera y las barras se leen, no se tocan.

   Tema SIEMPRE claro, a proposito: no hay variantes segun el modo del
   sistema. La app se ve igual lleve el telefono el ajuste que lleve. Si
   alguna vez se quisiera modo oscuro, se añade redefiniendo los tokens de
   :root, nunca metiendo colores dentro de los componentes. */

:root {
  --paper: #f2f3f6;
  --sup: #ffffff;
  --sup-2: #e9ebf1;
  --sup-3: #dfe2eb;
  --tinta: #161a26;
  --tinta-2: #4a5164;
  --tinta-3: #767d92;
  --linea: #d2d7e2;
  --acento: #2e3f86;
  --acento-suave: #dee3f6;
  --ok: #1b6b45;
  --ok-suave: #dbede3;
  --mal: #a63228;
  --mal-suave: #f7dfdb;
  --avisa: #7f5c12;
  --avisa-suave: #f4ead1;
  --radio: 10px;
  --seguro-inf: env(safe-area-inset-bottom, 0px);
  --seguro-sup: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overscroll-behavior: none;
}

body {
  background: var(--paper);
  color: var(--tinta);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

.mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
.num { font-variant-numeric: tabular-nums; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

/* ---------- estructura ---------- */

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 560px;
  margin: 0 auto;
  padding-top: var(--seguro-sup);
}

.cabecera {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px 6px;
}
.cabecera .periodo { font-weight: 600; font-size: 15px; }
.cabecera .sub { font-size: 12px; color: var(--tinta-3); }
.cabecera .iconos { display: flex; gap: 4px; }
.icono {
  width: 36px; height: 36px; display: grid; place-items: center;
  border-radius: 9px; font-size: 17px; color: var(--tinta-2);
}
.icono:active { background: var(--sup-2); }
.icono.alerta { color: var(--mal); }

/* La zona de captura NUNCA se encoge: es la que tiene que caer siempre bajo el
   pulgar. Cuando la pantalla es corta, lo que cede es la zona de lectura, que
   pasa a desplazarse. Al reves —que fue el primer intento— el teclado se
   comprime por debajo de su contenido y las barras se solapan con las fichas. */
.zona-lectura {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 16px 4px;
}
.zona-captura {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  padding: 0 12px calc(10px + var(--seguro-inf));
}

/* ---------- avisos ---------- */

.aviso {
  margin: 0 16px 10px;
  padding: 10px 13px;
  border-radius: var(--radio);
  font-size: 13.5px;
  line-height: 1.4;
  background: var(--sup);
  border: 1px solid var(--linea);
  border-left: 3px solid var(--tinta-3);
}
.aviso strong { display: block; margin-bottom: 2px; }
.aviso.rojo { background: var(--mal-suave); border-left-color: var(--mal); }
.aviso.ambar { background: var(--avisa-suave); border-left-color: var(--avisa); }
.aviso.verde { background: var(--ok-suave); border-left-color: var(--ok); }
.aviso .acciones { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.aviso button {
  padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 600;
  background: var(--sup-3);
}
.aviso button.principal { background: var(--acento); color: var(--sup); }
/* ---------- barras de techo ---------- */

.techos { display: grid; gap: 7px; margin-bottom: 10px; }

.techo {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 3px 10px;
  align-items: baseline;
  padding: 2px 0;
  border-radius: 8px;
}
.techo:active { background: var(--sup-2); }
.techo .nombre { font-size: 13.5px; font-weight: 600; }
.techo .cifra { font-size: 12.5px; color: var(--tinta-2); text-align: right; }
.techo .cifra b { color: var(--tinta); }
.techo .cifra.rebasado b { color: var(--mal); }

/* La pista es mas alta que el carril a proposito: los 2 px de sobra arriba y
   abajo son para que la marca de ritmo sobresalga y se lea como la muesca de
   una regla, no como un pixel perdido dentro de la barra. */
.pista {
  grid-column: 1 / -1;
  position: relative;
  height: 18px;
}
.canal {
  position: absolute; left: 0; right: 0; top: 2px; bottom: 2px;
  background: var(--sup-3);
  border-radius: 4px;
  overflow: hidden;
}
.relleno {
  position: absolute; inset: 0 auto 0 0;
  background: var(--ok);
  border-radius: 4px 0 0 4px;
  transition: width 180ms ease-out;
}
/* El sobrepaso no se distingue solo por color: lleva trama diagonal, para que
   la lectura sobreviva a un daltonismo rojo-verde. */
.relleno.rebasado {
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.3) 0 3px, rgba(255,255,255,0) 3px 7px),
    var(--mal);
}
.marca-ritmo {
  position: absolute; top: 0; bottom: 0; width: 2px;
  margin-left: -1px;            /* centrada justo en el dia, no a su derecha */
  background: var(--tinta);
  opacity: .5;
  border-radius: 1px;
}

@media (prefers-reduced-motion: reduce) { .relleno { transition: none; } }

/* ---------- captura ---------- */

.conmutador {
  display: flex; gap: 4px; padding: 3px;
  background: var(--sup-2); border-radius: 9px; margin-bottom: 7px;
}
.conmutador button {
  flex: 1; padding: 6px; border-radius: 7px; font-size: 13.5px; font-weight: 600;
  color: var(--tinta-3);
}
.conmutador button[aria-pressed='true'] { background: var(--sup); color: var(--tinta); }

.visor {
  text-align: right;
  padding: 2px 8px 8px;
  min-height: 52px;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.visor .importe {
  font-size: 38px; font-weight: 700; letter-spacing: -.02em; line-height: 1;
  font-variant-numeric: tabular-nums;
  font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
.visor .importe.vacio { color: var(--tinta-3); }
.visor .pista-txt { font-size: 12px; color: var(--tinta-3); margin-top: 5px; min-height: 16px; }

.fichas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 7px; }
.ficha {
  padding: 7px 4px; border-radius: 9px; background: var(--sup-2);
  font-size: 11.5px; font-weight: 600; text-align: center; line-height: 1.25;
  border: 2px solid transparent;
}
.ficha[aria-pressed='true'] { background: var(--acento-suave); border-color: var(--acento); color: var(--acento); }
.ficha .restante { display: block; font-size: 10px; font-weight: 500; color: var(--tinta-3); margin-top: 2px; }
.ficha[aria-pressed='true'] .restante { color: var(--acento); }

.previo-reparto { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 7px; }
.previo-reparto div {
  padding: 8px 4px; border-radius: 9px; background: var(--sup-2); text-align: center;
}
.previo-reparto .p { font-size: 10.5px; color: var(--tinta-3); }
.previo-reparto .v { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }

.teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tecla {
  height: 46px; border-radius: 10px; background: var(--sup);
  font-size: 22px; font-weight: 500; display: grid; place-items: center;
  border: 1px solid var(--linea);
}
.tecla:active { background: var(--sup-3); }
.tecla.accion { font-size: 18px; color: var(--tinta-2); }

.confirmar {
  margin-top: 7px; height: 50px; width: 100%; border-radius: 11px;
  background: var(--acento); color: var(--sup);
  font-size: 16.5px; font-weight: 700;
  display: grid; place-items: center;
  transition: opacity 120ms;
}
.confirmar[disabled] { opacity: .35; }
.confirmar:active:not([disabled]) { opacity: .85; }

/* ---------- hojas ---------- */

.velo {
  position: fixed; inset: 0; background: rgba(10, 12, 18, .45);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 40; animation: aparecer 150ms ease-out;
}
@keyframes aparecer { from { opacity: 0 } to { opacity: 1 } }

.hoja {
  width: 100%; max-width: 560px; max-height: 88dvh; overflow-y: auto;
  background: var(--paper);
  border-radius: 18px 18px 0 0;
  padding: 8px 18px calc(20px + var(--seguro-inf));
  animation: subir 200ms cubic-bezier(.2,.8,.3,1);
}
@keyframes subir { from { transform: translateY(14px) } to { transform: translateY(0) } }
@media (prefers-reduced-motion: reduce) {
  .velo, .hoja { animation: none; }
}

.hoja .asa { width: 36px; height: 4px; border-radius: 2px; background: var(--linea); margin: 0 auto 14px; }
.hoja h2 { font-size: 20px; margin: 0 0 8px; line-height: 1.2; letter-spacing: -.01em; }
.hoja h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--tinta-3); margin: 20px 0 8px; }
.hoja p { margin: 0 0 12px; font-size: 14.5px; color: var(--tinta-2); line-height: 1.5; }
.hoja p.destacado { color: var(--tinta); }

.botones { display: grid; gap: 8px; margin-top: 16px; }
.btn {
  padding: 14px; border-radius: 11px; font-size: 15.5px; font-weight: 600;
  text-align: center; background: var(--sup-2);
}
.btn.principal { background: var(--acento); color: var(--sup); }
.btn.peligro { background: var(--mal-suave); color: var(--mal); }
/* Dentro del boton destacado el texto secundario hereda el color del boton:
   var(--tinta-2) sobre el acento queda azul sobre azul e ilegible. */
.btn.principal small, .btn.principal b { color: inherit; }
.btn.principal small { opacity: .82; }
.btn small { color: var(--tinta-2); }
.btn small.nota-aviso { color: var(--avisa); }
.btn.principal small.nota-aviso { color: inherit; }
.btn[disabled] { opacity: .4; }

.sugerencia {
  display: flex; align-items: center; gap: 9px;
  padding: 12px 14px; border-radius: 11px;
  background: var(--ok-suave); color: var(--ok);
  font-size: 14px; font-weight: 600; margin-bottom: 4px;
}
.sugerencia .resto { margin-left: auto; font-weight: 500; opacity: .85; font-size: 13px; }

.lista { display: grid; gap: 1px; background: var(--linea); border-radius: var(--radio); overflow: hidden; }
.fila {
  display: grid; grid-template-columns: 1fr auto; gap: 3px 12px;
  padding: 11px 13px; background: var(--paper); align-items: baseline;
}
.fila .t { font-size: 14.5px; }
.fila .s { grid-column: 1; font-size: 12px; color: var(--tinta-3); }
.fila .v { font-size: 14.5px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.fila .v.neg { color: var(--mal); }
.fila .v.pos { color: var(--ok); }

.campo { margin-bottom: 14px; }
.campo label { display: block; font-size: 12.5px; color: var(--tinta-3); margin-bottom: 5px; }
.campo input, .campo select, .campo textarea {
  width: 100%; padding: 12px 13px; border-radius: 10px;
  border: 1px solid var(--linea); background: var(--sup); color: var(--tinta);
  font: inherit; font-size: 16px; /* 16px evita el zoom automatico de iOS */
  user-select: text;
}
.campo textarea { min-height: 78px; resize: vertical; }
.campo .ayuda { font-size: 11.5px; color: var(--tinta-3); margin-top: 4px; }
.campo.error input, .campo.error textarea { border-color: var(--mal); }

.etiquetas { display: flex; flex-wrap: wrap; gap: 6px; }
.etiquetas button {
  padding: 7px 12px; border-radius: 20px; background: var(--sup-2);
  font-size: 13px; font-weight: 500;
}
.etiquetas button[aria-pressed='true'] { background: var(--acento); color: var(--sup); }
.interruptor { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; }
.interruptor .txt { font-size: 14.5px; }
.interruptor .txt small { display: block; color: var(--tinta-3); font-size: 12px; }
.palanca { width: 48px; height: 28px; border-radius: 14px; background: var(--sup-3); position: relative; flex: none; }
.palanca::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
  border-radius: 50%; background: var(--sup); transition: transform 140ms;
}
.palanca[aria-pressed='true'] { background: var(--acento); }
.palanca[aria-pressed='true']::after { transform: translateX(20px); }

/* ---------- brindis de deshacer ---------- */

.brindis {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + var(--seguro-inf));
  display: flex; align-items: center; gap: 14px;
  padding: 11px 16px; border-radius: 12px;
  background: var(--tinta); color: var(--paper);
  font-size: 14px; z-index: 50; max-width: calc(100% - 28px);
  box-shadow: 0 8px 28px -10px rgba(0,0,0,.5);
}
.brindis button { font-weight: 700; color: var(--paper); text-decoration: underline; white-space: nowrap; }

/* ---------- banda de estado ---------- */

.banda {
  flex: none; padding: 7px 16px; font-size: 12px; text-align: center;
  background: var(--avisa-suave); color: var(--avisa); font-weight: 600;
}
.banda.rojo { background: var(--mal-suave); color: var(--mal); }
.banda button { text-decoration: underline; font-weight: 700; margin-left: 6px; }

.vacio { text-align: center; color: var(--tinta-3); font-size: 14px; padding: 26px 12px; }

/* ---------- bloqueo ---------- */

.bloqueo {
  position: fixed; inset: 0; z-index: 60;
  background: var(--paper);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 28px;
}
.bloqueo h1 { font-size: 22px; margin: 0; }
.bloqueo p { color: var(--tinta-2); font-size: 14.5px; text-align: center; margin: 0; max-width: 34ch; }
.puntos { display: flex; gap: 12px; }
.punto { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--tinta-3); }
.punto.lleno { background: var(--acento); border-color: var(--acento); }
.bloqueo .teclado { width: 100%; max-width: 280px; }

</style>
</head>

<div id="aviso-prueba">
  <b>Archivo de prueba</b> — misma lógica que la app real, generado desde su código.
  <span id="aviso-detalle"></span>
</div>
<style>
  #aviso-prueba { position: fixed; top: 0; left: 0; right: 0; z-index: 998;
    background: #7f5c12; color: #fff; font-size: 11.5px; line-height: 1.35;
    padding: 5px 12px; text-align: center;
    font-family: ui-monospace, Menlo, monospace; }
  #aviso-prueba b { font-weight: 700; }
  #app { padding-top: 28px; }
</style>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var d = document.getElementById('aviso-detalle');
    if (!d) return;
    var partes = [];
    if (location.protocol === 'file:') partes.push('sin Service Worker');
    if (!(window.crypto && window.crypto.subtle)) partes.push('SIN CIFRADO');
    if (partes.length) d.textContent = ' · ' + partes.join(' · ');
  });
</script>



<div id="app"><div class="vacio" style="margin:auto">Abriendo el almacén…</div></div>
<div id="hojas"></div>
<div id="brindis"></div>





<script>
(function () {
'use strict';

/* Registro de modulos. Sustituye al cargador de ES modules, que no funciona
   desde file://. El cache se rellena ANTES de ejecutar el modulo para que una
   dependencia circular no se quede en bucle. */
const __m = {};
const __c = {};
function __req(id) {
  if (__c[id]) return __c[id];
  const e = {};
  __c[id] = e;
  if (!__m[id]) throw new Error('Modulo no empaquetado: ' + id);
  __m[id](e, __req);
  return e;
}

__m['src/app/main.js'] = function (__e, __req) {
/**
 * Arranque y cableado de la interfaz.
 *
 * Un unico oyente en la raiz resuelve todos los eventos por delegacion, y un
 * unico render repinta. A esta escala es mas rapido y mucho menos codigo que
 * cualquier framework.
 *
 * Sin pantalla de bloqueo: la app abre directa (§17). Lo unico que puede
 * interponerse es el alta, y solo la primera vez.
 */

const { crearMotor } = __req('src/datos/motor-idb.js');
const { crearBoveda, haySubtle } = __req('src/datos/boveda.js');
const { crearRepo } = __req('src/datos/repo.js');
const { crearComandos } = __req('src/app/comandos.js');
const { relojReal } = __req('src/app/reloj.js');
const { crearEstado, capturaVacia } = __req('src/app/estado.js');

const { parsearCentavos, formatear } = __req('src/dominio/dinero.js');
const { ORDEN, ETIQUETAS, FONDO_AHORRO, CARTERA_INVERSION } = __req('src/dominio/buckets.js');
const { POR_ID: CATEGORIAS } = __req('src/dominio/categorias.js');
const { destinosDe, destinoAutomatico } = __req('src/dominio/destinos.js');
const { MODO, requierePreguntar, distribuirInformal } = __req('src/dominio/informales.js');

const { cabecera, panelTechos, teclado, fichasBucket,
  previoReparto, visor, avisoDiagnostico, avisoSobrante, esc, } = __req('src/ui/componentes.js');
const { hojaRechazo, hojaDetalleTecho, hojaInforme, hojaDiagnostico, hojaCategorias,
  hojaAjustes, hojaFondos, hojaAlta, hojaDestinos, hojaDistribucion,
  hojaDistribucionManual, hojaSobrante, } = __req('src/ui/hojas.js');

const raiz = document.getElementById('app');
const capaHojas = document.getElementById('hojas');
const capaBrindis = document.getElementById('brindis');

const estado = crearEstado({
  cargando: true,
  captura: capturaVacia(),
  hoja: null,
  brindis: null,
  banda: null,
});

let repo;
let comandos;
let boveda;
let reloj;
let temporizadorBrindis = null;

// =========================================================================
// Arranque
// =========================================================================

async function arrancar() {
  reloj = relojReal();
  const motor = await crearMotor();
  boveda = crearBoveda();
  repo = crearRepo(motor, boveda);

  // Sin PIN: el acceso es directo. Los datos quedan en claro en el
  // dispositivo, y eso se dice una vez en Ajustes, no en una banda que
  // molesta cada vez que abres la app.
  boveda.abrirEnClaro(haySubtle() ? 'SIN_PIN' : 'SIN_CRYPTO');

  comandos = crearComandos(repo, reloj);
  const arranque = await comandos.arrancar();
  const instantanea = await comandos.instantanea();

  estado.set({ cargando: false, ...instantanea });

  if (arranque.necesitaAlta) {
    abrirHoja({ tipo: 'alta' });
  } else if (arranque.cierres.length) {
    // Si acaba de cerrarse un mes, se enseña el informe sin que lo pidan.
    abrirHoja({ tipo: 'informe', informe: arranque.cierres[arranque.cierres.length - 1].informe });
  }

  document.addEventListener('visibilitychange', () => {
    // Al volver a primer plano puede haber cruzado la medianoche del dia 1.
    if (!document.hidden) refrescar();
  });
}

async function refrescar() {
  await comandos.asegurarPeriodos();
  const instantanea = await comandos.instantanea();
  estado.set(instantanea);
}

// =========================================================================
// Render
// =========================================================================

/** Aplica separador de miles a lo que se va tecleando. */
function formatearEntrada(digitos) {
  if (!digitos) return '0';
  const [enteros, decimales] = digitos.split(',');
  const conMiles = enteros.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return decimales !== undefined ? `${conMiles},${decimales}` : conMiles;
}

function pistaDeCaptura(s) {
  const c = s.captura;
  if (!c.digitos) return c.modo === 'ingreso' ? 'Teclea lo que entró' : 'Teclea el importe';

  if (c.modo === 'ingreso') {
    const centavos = parsearCentavos(c.digitos);
    const umbral = s.ajustes?.umbralPregunta ?? 5000;
    if (centavos > 0 && requierePreguntar(centavos, umbral)) return 'Te preguntaré cómo repartirlo';
    return 'Mitad Inversión, mitad Reserva';
  }

  if (!c.bucket) return 'Elige un techo';
  if (c.destinoTexto) return `${ETIQUETAS[c.bucket]} · ${c.destinoTexto}`;
  if (c.destinoId) {
    const d = destinosDe(s.ajustes, c.bucket).find((x) => x.id === c.destinoId);
    if (d) return `${ETIQUETAS[c.bucket]} · ${d.nombre}`;
  }
  const cat = CATEGORIAS[c.categoryId];
  return cat ? `${ETIQUETAS[c.bucket]} · ${cat.nombre}` : ETIQUETAS[c.bucket];
}

/** Vista previa del reparto de un ingreso informal, con las reglas nuevas. */
function previoIngreso(s, centavos) {
  if (!(centavos > 0) || !s.periodo) return null;
  const umbral = s.ajustes?.umbralPregunta ?? 5000;
  if (requierePreguntar(centavos, umbral)) return null;
  try {
    return distribuirInformal(centavos, s.periodo, { modo: MODO.MITADES, pesosBase: s.periodo.pesos }).partes;
  } catch {
    return null;
  }
}

function render(s) {
  if (s.cargando) {
    raiz.innerHTML = '<div class="vacio" style="margin:auto">Abriendo…</div>';
    return;
  }
  if (!s.periodo) return;

  const centavos = parsearCentavos(s.captura.digitos);
  const hayImporte = Number.isInteger(centavos) && centavos > 0;
  const esIngreso = s.captura.modo === 'ingreso';
  const listo = hayImporte && (esIngreso || Boolean(s.captura.bucket));

  raiz.innerHTML = `
    ${s.banda ? `<div class="banda ${esc(s.banda.clase)}">${esc(s.banda.texto)}</div>` : ''}
    ${cabecera(s.periodo, s)}

    <div class="zona-lectura">
      ${avisoDiagnostico(s.diagnostico)}
      ${avisoSobrante(s)}
      ${panelTechos(s.periodo, s.fecha)}
    </div>

    <div class="zona-captura">
      <div class="conmutador">
        <button data-accion="modo" data-modo="gasto" aria-pressed="${!esIngreso}">Gasto</button>
        <button data-accion="modo" data-modo="ingreso" aria-pressed="${esIngreso}">Ingreso</button>
      </div>

      ${visor(formatearEntrada(s.captura.digitos), pistaDeCaptura(s), s.captura.modo)}

      ${esIngreso
        ? previoReparto(previoIngreso(s, centavos))
        : fichasBucket(s.periodo, s.captura.bucket)}

      ${teclado()}

      <button class="confirmar" data-accion="confirmar" ${listo ? '' : 'disabled'}>
        ${esIngreso ? 'Registrar ingreso' : 'Guardar gasto'}
      </button>
    </div>`;

  capaHojas.innerHTML = s.hoja ? renderHoja(s) : '';
  capaBrindis.innerHTML = s.brindis
    ? `<div class="brindis"><span>${esc(s.brindis.texto)}</span>
         ${s.brindis.movimientoId
           ? `<button data-accion="deshacer" data-id="${esc(s.brindis.movimientoId)}">Deshacer</button>`
           : ''}</div>`
    : '';
}

function renderHoja(s) {
  const h = s.hoja;
  switch (h.tipo) {
    case 'alta':
      return hojaAlta({ moneda: s.ajustes?.moneda ?? 'R$' });
    case 'rechazo':
      return hojaRechazo({ ...h, captura: s.captura });
    case 'destinos':
      return hojaDestinos({
        bucket: h.bucket,
        ajustes: s.ajustes,
        captura: s.captura,
        importeTexto: s.captura.digitos ? `${s.ajustes?.moneda ?? 'R$'}${formatearEntrada(s.captura.digitos)}` : '',
      });
    case 'distribucion':
      return hojaDistribucion({ importeCents: h.importeCents, opciones: h.opciones });
    case 'distribucion-manual':
      return hojaDistribucionManual({ importeCents: h.importeCents, periodo: s.periodo });
    case 'sobrante':
      return hojaSobrante({
        pendiente: s.sobrantePendiente,
        sobranteActual: s.sobrante,
        historial: s.sobrantes,
        media: h.media ?? 0,
        fondos: s.fondos,
      });
    case 'detalle':
      return hojaDetalleTecho({ periodo: s.periodo, bucket: h.bucket, movimientos: s.ultimos, fecha: s.fecha });
    case 'informe':
      return hojaInforme({ informe: h.informe ?? s.ultimoInforme, periodId: s.periodo.id });
    case 'diagnostico':
      return hojaDiagnostico({ dx: s.diagnostico });
    case 'categorias':
      return hojaCategorias({ bucket: s.captura.bucket, modo: s.captura.modo });
    case 'ajustes':
      return hojaAjustes({ ajustes: s.ajustes, estadisticas: h.estadisticas, boveda });
    case 'fondos':
      return hojaFondos(h);
    default:
      return '';
  }
}

function abrirHoja(hoja) {
  estado.set({ hoja });
}

function cerrarHoja() {
  estado.set({ hoja: null });
}

function brindar(texto, movimientoId = null) {
  if (temporizadorBrindis) clearTimeout(temporizadorBrindis);
  estado.set({ brindis: { texto, movimientoId } });
  temporizadorBrindis = setTimeout(() => estado.set({ brindis: null }), 8000);
}

// =========================================================================
// Acciones
// =========================================================================

const acciones = {
  // --- teclado ---------------------------------------------------------
  digito(el, s) {
    const d = s.captura.digitos;
    const [, dec] = d.split(',');
    if (dec !== undefined && dec.length >= 2) return;
    if (d.replace(/[^\d]/g, '').length >= 12) return;
    estado.set({ captura: { ...s.captura, digitos: d + el.dataset.valor } });
  },

  coma(_el, s) {
    if (s.captura.digitos.includes(',')) return;
    const base = s.captura.digitos === '' ? '0' : s.captura.digitos;
    estado.set({ captura: { ...s.captura, digitos: `${base},` } });
  },

  borrar(_el, s) {
    estado.set({ captura: { ...s.captura, digitos: s.captura.digitos.slice(0, -1) } });
  },

  modo(el, s) {
    estado.set({ captura: { ...capturaVacia(), modo: el.dataset.modo, digitos: s.captura.digitos } });
  },

  /**
   * Elegir techo. Reserva tiene un solo destino y se asigna sola; Inversion y
   * Recompensas abren la lista; Esenciales sigue con categorias y nota libre.
   */
  'elegir-bucket'(el, s) {
    const bucket = el.dataset.bucket;
    const automatico = destinoAutomatico(s.ajustes, bucket);
    const lista = destinosDe(s.ajustes, bucket);

    if (automatico) {
      estado.set({
        captura: { ...s.captura, bucket, destinoId: automatico.id, destinoTexto: null, categoryId: null },
      });
      vibrar(8);
      return;
    }

    if (lista.length > 0) {
      estado.set({ captura: { ...s.captura, bucket, destinoId: null, destinoTexto: null, categoryId: null } });
      abrirHoja({ tipo: 'destinos', bucket });
      vibrar(8);
      return;
    }

    // Esenciales: comportamiento de siempre
    if (s.captura.bucket === bucket) {
      abrirHoja({ tipo: 'categorias' });
      return;
    }
    estado.set({ captura: { ...s.captura, bucket, categoryId: categoriaPorDefecto(bucket) } });
    vibrar(8);
  },

  'elegir-destino'(el, s) {
    const bucket = el.dataset.bucket;
    const destinoId = el.dataset.destino;
    const destino = destinosDe(s.ajustes, bucket).find((d) => d.id === destinoId);

    const captura = { ...s.captura, bucket, destinoId, destinoTexto: null };
    estado.set({ captura });

    // «Otro» se queda en la hoja para que escriban; el resto guarda ya.
    if (destino?.pideTexto) {
      abrirHoja({ tipo: 'destinos', bucket });
      setTimeout(() => capaHojas.querySelector('[data-campo="destinoTexto"]')?.focus(), 60);
      return;
    }
    cerrarHoja();
    if (parsearCentavos(captura.digitos) > 0) guardar(captura);
  },

  async 'confirmar-destino'(el, s) {
    const texto = capaHojas.querySelector('[data-campo="destinoTexto"]')?.value ?? '';
    if (!texto.trim()) {
      capaHojas.querySelector('.campo')?.classList.add('error');
      return;
    }
    const captura = { ...s.captura, bucket: el.dataset.bucket, destinoTexto: texto.trim() };
    estado.set({ captura, hoja: null });
    if (parsearCentavos(captura.digitos) > 0) await guardar(captura);
  },

  'elegir-categoria'(el, s) {
    estado.set({ captura: { ...s.captura, categoryId: el.dataset.cat }, hoja: null });
  },

  // --- confirmar -------------------------------------------------------
  async confirmar(_el, s) {
    await guardar(s.captura);
  },

  async 'aceptar-destino'(el, s) {
    await guardar({ ...s.captura, bucket: el.dataset.bucket, forzado: true });
  },

  async reintentar(_el, s) {
    await guardar(s.captura);
  },

  async 'confirmar-importe'(_el, s) {
    await guardar({ ...s.captura, confirmado: true });
  },

  async 'confirmar-con-justificacion'(_el, s) {
    const texto = capaHojas.querySelector('[data-campo="justificacion"]')?.value ?? '';
    if (texto.trim().length < 15) {
      capaHojas.querySelector('.campo')?.classList.add('error');
      return;
    }
    await guardar({ ...s.captura, justificacion: texto });
  },

  'alternar-tag'(el, s) {
    const tag = el.dataset.tag;
    const tags = s.captura.tags.includes(tag)
      ? s.captura.tags.filter((t) => t !== tag)
      : [...s.captura.tags, tag];
    estado.set({ captura: { ...s.captura, tags, nota: leerNota() } });
  },

  'alternar-campo'(el, s) {
    const campo = el.dataset.campo;
    estado.set({ captura: { ...s.captura, [campo]: !s.captura[campo], nota: leerNota() } });
  },

  async deshacer(el) {
    const r = await comandos.deshacer(el.dataset.id);
    estado.set({ brindis: null });
    if (r.ok) await refrescar();
  },

  // --- distribucion de ingresos ----------------------------------------

  async 'elegir-distribucion'(el, s) {
    const modo = el.dataset.modo;
    const importeCents = s.hoja.importeCents;

    if (modo === MODO.MANUAL) {
      abrirHoja({ tipo: 'distribucion-manual', importeCents });
      return;
    }
    cerrarHoja();
    await guardarIngreso(importeCents, { modo });
  },

  async 'elegir-bucket-ingreso'(el, s) {
    const importeCents = s.hoja.importeCents;
    cerrarHoja();
    await guardarIngreso(importeCents, { modo: MODO.MANUAL, bucketManual: el.dataset.bucket });
  },

  // --- alta -------------------------------------------------------------

  async 'guardar-alta'() {
    const texto = capaHojas.querySelector('[data-campo="altaIngreso"]')?.value ?? '';
    const centavos = parsearCentavos(texto);
    if (!(centavos > 0)) {
      capaHojas.querySelector('.campo')?.classList.add('error');
      return;
    }
    await comandos.configurarIngresoNormal(centavos);
    cerrarHoja();
    await refrescar();
    brindar(`Listo. Cada día 1 entrarán ${formatear(centavos)}.`);
  },

  async 'saltar-alta'() {
    const ajustes = await repo.ajustes();
    await repo.guardarAjustes({
      ...ajustes,
      ingresoNormal: { ...ajustes.ingresoNormal, configurado: true, montoCents: 0 },
    });
    cerrarHoja();
    await refrescar();
  },

  // --- hojas -----------------------------------------------------------
  'cerrar-hoja': cerrarHoja,

  'detalle-techo'(el) {
    abrirHoja({ tipo: 'detalle', bucket: el.dataset.bucket });
  },

  async 'ver-fondos'() {
    abrirHoja({
      tipo: 'fondos',
      fondos: await repo.fondos(),
      entradasAhorro: await repo.entradasFondo(FONDO_AHORRO, 12),
      entradasCartera: await repo.entradasFondo(CARTERA_INVERSION, 12),
    });
  },

  async 'ver-informe'(_el, s) {
    abrirHoja({ tipo: 'informe', informe: s.ultimoInforme });
  },

  async 'ver-sobrante'() {
    const { media } = await comandos.historialSobrantes();
    abrirHoja({ tipo: 'sobrante', media });
  },

  'ver-diagnostico'() {
    abrirHoja({ tipo: 'diagnostico' });
  },

  async 'ver-ajustes'() {
    abrirHoja({ tipo: 'ajustes', estadisticas: await repo.estadisticas() });
  },

  'ver-esenciales'() {
    abrirHoja({ tipo: 'detalle', bucket: 'ESENCIALES' });
  },

  // --- sobrante ---------------------------------------------------------

  async 'resolver-sobrante'(el) {
    const r = await comandos.resolverSobrante(el.dataset.periodo, el.dataset.destino);
    cerrarHoja();
    await refrescar();
    if (r.ok) {
      brindar(
        el.dataset.destino === 'NADA'
          ? 'Anotado. El sobrante queda registrado igual.'
          : `${formatear(r.registro.sobranteCents)} colocados. El historial no cambia.`,
      );
    }
  },

  // --- diagnostico -----------------------------------------------------
  async 'aplicar-propuesta'(_el, s) {
    await comandos.aplicarPropuesta(s.diagnostico.propuesta.pesosBps);
    cerrarHoja();
    await refrescar();
    brindar('Nuevo reparto aplicado desde el próximo ciclo.');
  },

  async 'posponer-diagnostico'(_el, s) {
    const ajustes = await repo.ajustes();
    await repo.guardarAjustes({ ...ajustes, diagnosticoPospuestoHasta: s.periodo.id });
    cerrarHoja();
  },

  // --- ajustes ---------------------------------------------------------

  async 'guardar-ingreso-normal'() {
    const centavos = parsearCentavos(capaHojas.querySelector('[data-campo="ingresoNormal"]')?.value ?? '');
    if (!(centavos > 0)) {
      capaHojas.querySelector('.campo')?.classList.add('error');
      return;
    }
    await comandos.configurarIngresoNormal(centavos, { aplicarYa: false });
    await refrescar();
    abrirHoja({ tipo: 'ajustes', estadisticas: await repo.estadisticas() });
    brindar(`Ingreso mensual: ${formatear(centavos)}.`);
  },

  async 'guardar-umbral'() {
    const centavos = parsearCentavos(capaHojas.querySelector('[data-campo="umbralPregunta"]')?.value ?? '');
    if (!(centavos > 0)) return;
    const ajustes = await repo.ajustes();
    await repo.guardarAjustes({ ...ajustes, umbralPregunta: centavos });
    await refrescar();
    abrirHoja({ tipo: 'ajustes', estadisticas: await repo.estadisticas() });
  },

  async 'añadir-destino'(el) {
    const nombre = prompt('Nombre del destino');
    if (!nombre?.trim()) return;
    const bucket = el.dataset.bucket;
    const ajustes = await repo.ajustes();
    const lista = [...destinosDe(ajustes, bucket)];
    lista.splice(Math.max(0, lista.length - 1), 0, {
      id: `u-${Date.now().toString(36)}`,
      nombre: nombre.trim(),
      pideTexto: false,
    });
    await repo.guardarAjustes({ ...ajustes, destinos: { ...ajustes.destinos, [bucket]: lista } });
    await refrescar();
    abrirHoja({ tipo: 'ajustes', estadisticas: await repo.estadisticas() });
  },

  async 'renombrar-destino'(el) {
    const { bucket, destino } = el.dataset;
    const ajustes = await repo.ajustes();
    const lista = destinosDe(ajustes, bucket);
    const actual = lista.find((d) => d.id === destino);
    const nombre = prompt('Nuevo nombre (vacío para borrarlo)', actual?.nombre ?? '');
    if (nombre === null) return;

    const nueva = nombre.trim()
      ? lista.map((d) => (d.id === destino ? { ...d, nombre: nombre.trim() } : d))
      : lista.filter((d) => d.id !== destino);

    await repo.guardarAjustes({ ...ajustes, destinos: { ...ajustes.destinos, [bucket]: nueva } });
    await refrescar();
    abrirHoja({ tipo: 'ajustes', estadisticas: await repo.estadisticas() });
  },

  async 'alternar-aviso'(el) {
    const clave = el.dataset.aviso;
    const ajustes = await repo.ajustes();
    const n = { ...ajustes.notificaciones, [clave]: !ajustes.notificaciones[clave] };
    await repo.guardarAjustes({ ...ajustes, notificaciones: n });
    await refrescar();
    abrirHoja({ tipo: 'ajustes', estadisticas: await repo.estadisticas() });
  },

  async exportar() {
    const datos = await repo.exportar();
    const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `finc-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },

  async 'borrar-todo'() {
    if (!confirm('Se borra todo el historial de este dispositivo. No hay vuelta atrás. ¿Seguro?')) return;
    await repo.vaciar();
    location.reload();
  },
};

function categoriaPorDefecto(bucket) {
  const s = estado.get();
  const previos = (s.ultimos ?? []).filter((m) => m.bucket === bucket && m.categoryId);
  if (previos.length) return previos[0].categoryId;
  const cats = Object.values(CATEGORIAS).filter((c) => c.defaultBucket === bucket);
  return cats[0]?.id ?? null;
}

function leerNota() {
  return capaHojas.querySelector('[data-campo="nota"]')?.value ?? estado.get().captura.nota;
}

function vibrar(ms) {
  try {
    navigator.vibrate?.(ms);
  } catch {
    /* no todos los dispositivos lo tienen */
  }
}

/** Camino unico de guardado de gastos. */
async function guardar(captura) {
  if (captura.modo === 'ingreso') {
    const centavos = parsearCentavos(captura.digitos);
    return guardarIngreso(centavos, {});
  }

  const centavos = parsearCentavos(captura.digitos);
  if (!(centavos > 0)) return;

  const nota = leerNota();
  const razon = capaHojas.querySelector('[data-campo="razonReserva"]')?.value || captura.razonReserva;

  const cmd = {
    importeCents: centavos,
    bucket: captura.bucket,
    categoryId: captura.categoryId,
    destinoId: captura.destinoId,
    destinoTexto: captura.destinoTexto,
    nota,
    tags: captura.tags,
    razonReserva: razon,
    usoProfesional: captura.usoProfesional,
    certificable: captura.certificable,
    relacionadaConIngreso: captura.relacionadaConIngreso,
    justificacion: captura.justificacion,
    comercioTipo: captura.comercioTipo,
    aceptaForzado: captura.forzado,
    confirmado: captura.confirmado,
  };

  const r = await comandos.registrarGasto(cmd);

  if (r.faltaDestino) {
    estado.set({ captura: { ...captura, nota } });
    abrirHoja({ tipo: 'destinos', bucket: r.bucket });
    return;
  }

  if (!r.ok) {
    estado.set({ captura: { ...captura, nota, razonReserva: razon } });
    abrirHoja({ tipo: 'rechazo', veredicto: r.veredicto, sugerencia: r.sugerencia, requiere: r.requiere });
    vibrar([12, 60, 12]);
    return;
  }

  vibrar(14);
  estado.set({ captura: capturaVacia(), hoja: null });
  await refrescar();

  const texto = r.aviso
    ? `${formatear(centavos)} · ${r.aviso.mensaje}`
    : r.rebasado
      ? `${formatear(centavos)} · techo rebasado`
      : `Guardado ${formatear(centavos)}`;
  brindar(texto, r.movimiento.id);
}

/** Camino unico de registro de ingresos informales. */
async function guardarIngreso(centavos, { modo, bucketManual }) {
  if (!(centavos > 0)) return;

  const r = await comandos.registrarIngreso({ importeCents: centavos, modo, bucketManual });

  if (r.requierePreguntar) {
    abrirHoja({ tipo: 'distribucion', importeCents: r.importeCents, opciones: r.opciones });
    return;
  }
  if (!r.ok) {
    brindar(r.veredicto?.mensaje ?? 'No se pudo registrar.');
    return;
  }

  vibrar(14);
  estado.set({ captura: capturaVacia(), hoja: null });
  await refrescar();

  const destinos = ORDEN.filter((b) => r.reparto[b] > 0)
    .map((b) => `${formatear(r.reparto[b])} a ${ETIQUETAS[b]}`)
    .join(' · ');
  brindar(destinos, r.movimiento.id);
}

// =========================================================================
// Delegacion de eventos
// =========================================================================

document.addEventListener('click', async (evento) => {
  const el = evento.target.closest('[data-accion]');
  if (!el) return;

  // El velo cierra la hoja; el contenido de la hoja, no.
  if (el.dataset.accion === 'cerrar-hoja' && evento.target.closest('[data-parar]') && evento.target !== el) {
    return;
  }

  const fn = acciones[el.dataset.accion];
  if (!fn) return;
  evento.preventDefault();

  try {
    await fn(el, estado.get());
  } catch (e) {
    console.error('Acción fallida:', el.dataset.accion, e);
    estado.set({ banda: { clase: 'rojo', texto: `Algo falló: ${e.message}` } });
  }
});

// Pulsacion larga sobre una ficha: abre la lista completa de destinos.
let temporizadorLargo = null;
document.addEventListener('pointerdown', (evento) => {
  const ficha = evento.target.closest('[data-accion="elegir-bucket"]');
  if (!ficha) return;
  temporizadorLargo = setTimeout(() => {
    const s = estado.get();
    const bucket = ficha.dataset.bucket;
    estado.set({ captura: { ...s.captura, bucket } });
    abrirHoja({ tipo: destinosDe(s.ajustes, bucket).length ? 'destinos' : 'categorias', bucket });
    vibrar(18);
  }, 480);
});
document.addEventListener('pointerup', () => clearTimeout(temporizadorLargo));
document.addEventListener('pointercancel', () => clearTimeout(temporizadorLargo));

// Teclado fisico, util al probar en el ordenador.
document.addEventListener('keydown', (evento) => {
  if (evento.target.matches('input, textarea, select')) return;
  const s = estado.get();
  if (/^[0-9]$/.test(evento.key)) {
    acciones.digito({ dataset: { valor: evento.key } }, s);
  } else if (evento.key === 'Backspace') {
    acciones.borrar({}, s);
  } else if (evento.key === ',' || evento.key === '.') {
    acciones.coma({}, s);
  } else if (evento.key === 'Enter') {
    raiz.querySelector('.confirmar:not([disabled])')?.click();
  } else if (evento.key === 'Escape') {
    cerrarHoja();
  }
});

estado.suscribir(render);

// Service Worker: su ausencia no puede romper la app.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('./sw.js').then((reg) => {
    reg.addEventListener('updatefound', () => {
      const nuevo = reg.installing;
      nuevo?.addEventListener('statechange', () => {
        if (nuevo.state === 'installed' && navigator.serviceWorker.controller) {
          estado.set({
            banda: { clase: '', texto: 'Nueva versión lista. Cierra y vuelve a abrir para actualizar.' },
          });
        }
      });
    });
  }).catch(() => {
    /* sin service worker se sigue funcionando, solo sin precarga offline */
  });
}

arrancar().catch((e) => {
  console.error(e);
  raiz.innerHTML = `<div class="vacio" style="margin:auto">No se pudo abrir el almacén.<br><small>${esc(e.message)}</small></div>`;
});

// Expuesto para el panel del archivo de prueba.
window.__auditor = {

const envolver = (contenido) => `<div class="velo" data-accion="cerrar-hoja"><div class="hoja" data-parar>
  <div class="asa"></div>${contenido}</div></div>`;

/**
 * Hoja de rechazo. Nunca es un aviso que se desvanece: el usuario debe
 * entender que regla actuo y cual es la salida correcta.
 */
function hojaRechazo({ veredicto, sugerencia, requiere, captura }) {
  const destino = sugerencia?.bucket ?? veredicto.bucketDestino;

  const requisitos = veredicto.requisitos?.length
    ? `<h3>Qué necesito</h3><ul style="margin:0 0 14px;padding-left:20px;font-size:14px;color:var(--tinta-2)">
         ${veredicto.requisitos.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>`
    : '';

  const explicacion = veredicto.explicacion?.length
    ? `<p style="font-size:12.5px;color:var(--tinta-3)">Se cumplió que ${esc(veredicto.explicacion.join(', y que '))}.</p>`
    : '';

  const chip = destino
    ? `<div class="sugerencia">
         <span>→ ${esc(ETIQUETAS[destino] ?? destino)}</span>
       </div>`
    : '';

  let acciones = '';
  if (veredicto.tipo === 'FORCE' && destino) {
    acciones = `
      <button class="btn principal" data-accion="aceptar-destino" data-bucket="${destino}">
        Guardar en ${esc(ETIQUETAS[destino])}
      </button>
      <button class="btn" data-accion="cerrar-hoja">Cambiar categoría</button>`;
  } else if (requiere === 'evidencia') {
    acciones = `
      <div class="campo">
        <label for="nota-evidencia">Explica por qué</label>
        <textarea id="nota-evidencia" data-campo="nota" placeholder="Una frase basta">${esc(captura?.nota ?? '')}</textarea>
      </div>
      ${etiquetasSugeridas(veredicto, captura)}
      ${veredicto.ruleId === 'R-06' ? interruptorCampo('usoProfesional', 'Es de uso profesional', captura) : ''}
      ${veredicto.ruleId === 'R-10' ? interruptorCampo('certificable', 'Da una certificación', captura) : ''}
      ${veredicto.ruleId === 'R-10' ? interruptorCampo('relacionadaConIngreso', 'Se relaciona con mi trabajo', captura) : ''}
      <button class="btn principal" data-accion="reintentar">Volver a intentar</button>
      ${destino ? `<button class="btn" data-accion="aceptar-destino" data-bucket="${destino}">Guardar en ${esc(ETIQUETAS[destino])}</button>` : ''}`;
  } else if (requiere === 'confirmacion') {
    // Un si o un no. Sin campo de texto: no se justifica, se confirma.
    acciones = `
      <button class="btn principal" data-accion="confirmar-importe">Sí, es correcto</button>
      <button class="btn" data-accion="cerrar-hoja">Lo corrijo</button>`;
  } else if (requiere === 'justificacion') {
    acciones = `
      <div class="campo">
        <label for="just">Justificación (15 caracteres como mínimo)</label>
        <textarea id="just" data-campo="justificacion" placeholder="¿Qué fue exactamente?"></textarea>
        <span class="ayuda">Quedará señalado en el informe del mes.</span>
      </div>
      <button class="btn principal" data-accion="confirmar-con-justificacion">Guardar igual</button>
      <button class="btn" data-accion="cerrar-hoja">Mejor no</button>`;
  } else if (veredicto.ruleId === 'R-08') {
    acciones = `
      <div class="campo">
        <label for="razon">Motivo de la retirada</label>
        <select id="razon" data-campo="razonReserva">
          <option value="">Elige uno…</option>
          ${RAZONES_RESERVA.map((r) => `<option value="${r.id}">${esc(r.nombre)}</option>`).join('')}
        </select>
      </div>
      <button class="btn principal" data-accion="reintentar">Continuar</button>
      <button class="btn" data-accion="cerrar-hoja">Cancelar</button>`;
  } else {
    acciones = `<button class="btn principal" data-accion="cerrar-hoja">Entendido</button>`;
  }

  return envolver(`
    <h2>${esc(veredicto.mensaje)}</h2>
    <p class="destacado">${esc(veredicto.porque)}</p>
    ${explicacion}
    ${requisitos}
    ${chip}
    <div class="botones">${acciones}</div>
    ${requiere === 'confirmacion'
      ? ''
      : `<p style="font-size:11.5px;color:var(--tinta-3);text-align:center;margin:14px 0 0">
           Regla ${esc(veredicto.ruleId ?? '—')}${veredicto.anulable ? '' : ' · no se puede desactivar'}
         </p>`}`);
}

function etiquetasSugeridas(veredicto, captura) {
  const porRegla = {
    'R-04': ['viaje-laboral'],
    'R-03': ['viaje-laboral'],
    'R-07': ['uniforme', 'epp', 'calzado-seguridad'],
    'R-09': ['prescripcion-medica'],
    'R-13': ['viaje-laboral'],
  };
  const tags = porRegla[veredicto.ruleId];
  if (!tags) return '';
  return `
    <div class="campo">
      <label>Etiquetas</label>
      <div class="etiquetas">
        ${tags
          .map(
            (t) =>
              `<button data-accion="alternar-tag" data-tag="${t}" aria-pressed="${(captura?.tags ?? []).includes(t)}">${esc(t.replace(/-/g, ' '))}</button>`,
          )
          .join('')}
      </div>
    </div>`;
}

function interruptorCampo(campo, texto, captura) {
  return `
    <div class="interruptor">
      <span class="txt">${esc(texto)}</span>
      <button class="palanca" data-accion="alternar-campo" data-campo="${campo}"
              aria-pressed="${Boolean(captura?.[campo])}" aria-label="${esc(texto)}"></button>
    </div>`;
}

/** Detalle de un techo al tocar su barra. */
function hojaDetalleTecho({ periodo, bucket, movimientos, fecha }) {
  const techo = periodo.techos[bucket] ?? 0;
  const gastado = periodo.totales[bucket] ?? 0;
  const restante = margen(periodo, bucket);
  const proy = proyeccion(periodo, bucket, fecha);

  // Lo mismo que dice la marca vertical de la barra, pero con palabras.
  const dia = diaDeFecha(fecha);
  const dias = diasEnPeriodo(periodo.id);
  const delMes = dia / dias;
  const delTecho = techo > 0 ? gastado / techo : 0;
  const adelantado = delTecho > delMes;
  const delBucket = movimientos.filter((m) => m.bucket === bucket).slice(0, 10);

  const porCategoria = {};
  for (const m of movimientos.filter((x) => x.bucket === bucket)) {
    porCategoria[m.categoryId] = (porCategoria[m.categoryId] ?? 0) + m.importeCents;
  }
  const top = Object.entries(porCategoria).sort((a, b) => b[1] - a[1]).slice(0, 5);

  return envolver(`
    <h2>${esc(ETIQUETAS[bucket])}</h2>
    <div class="lista">
      <div class="fila"><span class="t">Techo del mes</span><span class="v">${formatear(techo)}</span></div>
      <div class="fila"><span class="t">Gastado</span><span class="v">${formatear(gastado)} <small style="color:var(--tinta-3)">${porcentaje(gastado, techo)} %</small></span></div>
      <div class="fila"><span class="t">${restante < 0 ? 'Rebasado en' : 'Queda'}</span>
        <span class="v ${restante < 0 ? 'neg' : 'pos'}">${formatear(Math.abs(restante))}</span></div>
      <div class="fila"><span class="t">Proyección a fin de mes</span>
        <span class="v ${proy > techo ? 'neg' : ''}">${formatear(proy)}</span>
        <span class="s">al ritmo actual de gasto</span></div>
      <div class="fila"><span class="t">Ritmo</span>
        <span class="v ${adelantado ? 'neg' : 'pos'}">${Math.round(delTecho * 100)} % vs ${Math.round(delMes * 100)} %</span>
        <span class="s">llevas gastado frente al mes transcurrido ·
          ${adelantado ? 'vas por delante, ojo' : 'vas por detrás, bien'}</span></div>
    </div>
    <p style="font-size:12.5px;margin-top:10px">
      La línea vertical de cada barra marca esto mismo: por dónde va el mes.
      Hoy es el día ${dia} de ${dias}. Si la barra pasa la marca, gastas más
      rápido de lo que corre el calendario.
    </p>

    ${top.length ? `<h3>Por categoría</h3><div class="lista">${top
      .map(
        ([id, cents]) =>
          `<div class="fila"><span class="t">${esc(CATEGORIAS[id]?.nombre ?? id ?? 'Sin categoría')}</span><span class="v">${formatear(cents)}</span></div>`,
      )
      .join('')}</div>` : ''}

    ${delBucket.length
      ? `<h3>Últimos movimientos</h3><div class="lista">${delBucket.map((m) => filaMovimiento(m, CATEGORIAS)).join('')}</div>`
      : '<p class="vacio">Todavía no hay movimientos en este techo.</p>'}

    <div class="botones"><button class="btn" data-accion="cerrar-hoja">Cerrar</button></div>`);
}

/** Informe de cierre archivado. */
function hojaInforme({ informe, periodId }) {
  if (!informe) {
    return envolver(`
      <h2>Aún no hay informes</h2>
      <p>El primero se genera automáticamente cuando termine el mes en curso. No tienes que hacer nada.</p>
      <div class="botones"><button class="btn" data-accion="cerrar-hoja">Entendido</button></div>`);
  }

  const buckets = informe.porBucket
    .map((b) => {
      const rebasado = b.excesoCents > 0;
      return `<div class="fila">
        <span class="t">${esc(ETIQUETAS[b.bucket])}</span>
        <span class="v ${rebasado ? 'neg' : ''}">${Math.round(b.utilizacion * 100)} %</span>
        <span class="s">${formatear(b.gastado)} de ${formatear(b.techo)} · ${
          rebasado
            ? `rebasado en ${formatear(b.excesoCents)}`
            : b.remanenteCents > 0
              ? `${formatear(b.remanenteCents)} → ${esc(etiquetaDestino(b.destinoRemanente))}`
              : 'sin remanente'
        }</span>
      </div>`;
    })
    .join('');

  const cobros = informe.cobrosIncompletos?.length
    ? `<h3>Cobros a medias</h3><div class="lista">${informe.cobrosIncompletos
        .map(
          (c) =>
            `<div class="fila"><span class="t">${esc(c.grupo)}</span><span class="v neg">${formatear(c.pendiente)}</span><span class="s">pendiente de ${formatear(c.pactado)}</span></div>`,
        )
        .join('')}</div>`
    : '';

  const reglas = Object.entries(informe.reglas?.porRegla ?? {});
  const choques = reglas.length
    ? `<h3>Choques con las reglas</h3><div class="lista">${reglas
        .map(([id, n]) => {
          const r = REGLAS_NUCLEO.find((x) => x.id === id);
          return `<div class="fila"><span class="t">${esc(r?.mensaje ?? id)}</span><span class="v">${n}×</span><span class="s">${esc(id)}</span></div>`;
        })
        .join('')}</div>`
    : '';

  return envolver(`
    <h2>${esc(nombrePeriodo(informe.periodId ?? periodId))}</h2>
    <div class="lista">
      <div class="fila"><span class="t">Ingresado</span><span class="v pos">${formatear(informe.ingresoTotal)}</span></div>
      <div class="fila"><span class="t">Gastado</span><span class="v">${formatear(informe.gastoTotal)}</span></div>
      <div class="fila"><span class="t">Al Fondo de Ahorro</span><span class="v pos">${formatear(informe.carry.aFondo)}</span>
        <span class="s">remanente de Reserva</span></div>
      ${informe.carry.aCartera > 0 ? `<div class="fila"><span class="t">A la Cartera</span><span class="v pos">${formatear(informe.carry.aCartera)}</span></div>` : ''}
      ${informe.carry.expirado > 0 ? `<div class="fila"><span class="t">Expirado</span><span class="v">${formatear(informe.carry.expirado)}</span><span class="s">no se arrastra al mes siguiente</span></div>` : ''}
      ${informe.sobranteCents > 0 ? `<div class="fila"><span class="t">Te sobró</span><span class="v pos">${formatear(informe.sobranteCents)}</span>
        <span class="s">de Esenciales y Recompensas, libre para invertir o reservar</span></div>` : ''}
    </div>

    <h3>Techos</h3>
    <div class="lista">${buckets}</div>
    ${cobros}
    ${choques}

    <div class="botones"><button class="btn" data-accion="cerrar-hoja">Cerrar</button></div>`);
}

/** Propuesta del diagnostico de subfinanciamiento. */
function hojaDiagnostico({ dx }) {
  const a = dx.alerta;
  const p = dx.propuesta;

  const tabla = p?.viable
    ? `<div class="lista">${ORDEN.map((b) => {
        const antes = p.actual[b];
        const despues = p.propuesto[b];
        const delta = despues - antes;
        return `<div class="fila">
          <span class="t">${esc(ETIQUETAS[b])}</span>
          <span class="v ${delta > 0 ? 'pos' : delta < 0 ? 'neg' : ''}">${antes} % → ${despues} %</span>
          ${delta !== 0 ? `<span class="s">${delta > 0 ? '+' : ''}${delta} puntos</span>` : '<span class="s">sin cambios</span>'}
        </div>`;
      }).join('')}</div>`
    : '';

  const serie = dx.utilizaciones.map((u) => `${Math.round(u * 100)} %`).join(' · ');

  return envolver(`
    <h2>${esc(a.titular)}</h2>
    <p class="destacado">${esc(a.evidencia)}</p>
    <p style="font-family:ui-monospace,monospace;font-size:13px">${esc(serie)}</p>
    <p>${esc(a.diagnostico)}</p>
    ${tabla}
    <div class="botones">
      ${p?.viable
        ? `<button class="btn principal" data-accion="aplicar-propuesta">${esc(a.accionPrimaria)}</button>`
        : ''}
      <button class="btn" data-accion="ver-esenciales">Ver mis Esenciales</button>
      <button class="btn" data-accion="posponer-diagnostico">Ahora no</button>
    </div>
    <p style="font-size:11.5px;color:var(--tinta-3);text-align:center;margin:14px 0 0">
      Nada cambia hasta que lo apruebes. Quedará anotado en la bitácora.
    </p>`);
}

/** Selector de categoria, que aparece tras elegir techo si hace falta. */
function hojaCategorias({ bucket, modo }) {
  const cats = modo === 'ingreso' ? deIngreso() : deBucket(bucket);
  const otras = modo === 'ingreso' ? [] : Object.values(CATEGORIAS).filter((c) => c.defaultBucket && c.defaultBucket !== bucket);

  return envolver(`
    <h2>¿Qué fue?</h2>
    <div class="etiquetas" style="margin-bottom:18px">
      ${cats.map((c) => `<button data-accion="elegir-categoria" data-cat="${c.id}">${esc(c.nombre)}</button>`).join('')}
    </div>
    ${otras.length
      ? `<h3>Otras categorías</h3>
         <p style="font-size:12.5px">Si eliges una de aquí, puede que una regla la reubique.</p>
         <div class="etiquetas">
           ${otras.map((c) => `<button data-accion="elegir-categoria" data-cat="${c.id}">${esc(c.nombre)}</button>`).join('')}
         </div>`
      : ''}
    <div class="botones"><button class="btn" data-accion="cerrar-hoja">Cancelar</button></div>`);
}

  return envolver(`

    <h3>Ingreso mensual normal</h3>

    <div class="campo">
      <label for="ing-normal">Cuánto ingresas al mes, normalmente</label>
      <input id="ing-normal" type="text" inputmode="decimal" data-campo="ingresoNormal"
             value="${ing.montoCents ? formatear(ing.montoCents).replace(/^\D+/, '') : ''}"
             placeholder="1.500">
      <span class="ayuda">${ing.configurado ? 'Cambiarlo afecta a los meses siguientes; el mes en curso no se recalcula.' : 'Todavía sin configurar.'}</span>
    </div>
    <div class="botones" style="margin-top:0">
      <button class="btn principal" data-accion="guardar-ingreso-normal">Guardar ingreso normal</button>
    </div>

    <h3>Reparto actual</h3>
    <div class="lista">
      ${ORDEN.map(
        (b) => `<div class="fila"><span class="t">${esc(ETIQUETAS[b])}</span><span class="v">${p[b] / 100} %</span></div>`,
      ).join('')}
    </div>

    <h3>Destinos</h3>
    <p style="font-size:13px">Lo que aparece al elegir cada techo. Esenciales no lleva: usa categoría y nota libre.</p>
    ${ORDEN.filter((b) => destinosDe(ajustes, b).length > 0)
      .map(
        (b) => `<div class="lista" style="margin-bottom:8px">
          <div class="fila" style="background:var(--sup-2)"><span class="t" style="font-weight:600">${esc(ETIQUETAS[b])}</span>
            <span class="v"><button data-accion="añadir-destino" data-bucket="${b}" style="color:var(--acento);font-weight:600">+ añadir</button></span></div>
          ${destinosDe(ajustes, b)
            .map(
              (d) => `<div class="fila"><span class="t">${esc(d.nombre)}${d.pideTexto ? ' <small style="color:var(--tinta-3)">· pide texto</small>' : ''}</span>
                <span class="v"><button data-accion="renombrar-destino" data-bucket="${b}" data-destino="${esc(d.id)}" style="color:var(--acento)">editar</button></span></div>`,
            )
            .join('')}
        </div>`,
      )
      .join('')}

    <h3>Ingresos informales</h3>
    <div class="campo">
      <label for="umbral">A partir de cuánto te pregunto cómo repartirlo</label>
      <input id="umbral" type="text" inputmode="decimal" data-campo="umbralPregunta"
             value="${formatear(ajustes.umbralPregunta ?? 5000).replace(/^\D+/, '')}">
      <span class="ayuda">Por debajo va mitad Inversión, mitad Reserva, sin preguntar.</span>
    </div>
    <div class="botones" style="margin-top:0">
      <button class="btn" data-accion="guardar-umbral">Guardar umbral</button>
    </div>

    <h3>Avisos</h3>
    ${[
      ['sobrante', 'Lo que te sobra, al acabar el mes'],
      ['informe', 'Informe de cierre listo'],
      ['subfinanciamiento', 'Revisión de fondo del reparto'],
      ['proyeccion', 'Proyección de sobrepaso'],
      ['inactividad', 'Llevo días sin registrar'],
    ]
      .map(
        ([k, t]) => `<div class="interruptor">
          <span class="txt">${esc(t)}</span>
          <button class="palanca" data-accion="alternar-aviso" data-aviso="${k}"
                  aria-pressed="${Boolean(n[k])}" aria-label="${esc(t)}"></button>
        </div>`,
      )
      .join('')}

    <h3>Las 18 reglas</h3>
    <p style="font-size:12.5px">No se pueden desactivar. Si pudieras apagarlas, dejarían de servir justo el primer día difícil.</p>

      ${REGLAS_NUCLEO.map(
        (r) => `<div class="fila"><span class="t">${esc(r.mensaje)}</span><span class="v">${esc(r.id)}</span>
          <span class="s">${esc(r.porque.slice(0, 90))}…</span></div>`,
      ).join('')}

    <h3>Almacén</h3>
    <div class="lista">
      <div class="fila"><span class="t">Motor</span><span class="v">${esc(estadisticas.motor)}</span>

      <div class="fila"><span class="t">Cifrado</span><span class="v">${boveda.cifra ? 'sí' : 'no'}</span>

    <div class="botones">
      <button class="btn" data-accion="exportar">Exportar copia</button>
      <button class="btn" data-accion="cerrar-hoja">Cerrar</button>
      <button class="btn peligro" data-accion="borrar-todo">Borrar todo</button>
    </div>`);
}

function hojaFondos({ fondos, entradasAhorro, entradasCartera }) {
  const lista = (entradas) =>
    entradas.length
      ? `<div class="lista">${entradas
          .map(
            (e) =>
              `<div class="fila"><span class="t">${esc(nombrePeriodo(e.periodId ?? '—'))}</span>
                <span class="v pos">+${formatear(e.delta)}</span>
                <span class="s">${esc(e.motivo ?? '')}</span></div>`,
          )
          .join('')}</div>`
      : '<p class="vacio">Todavía no hay aportes. El primero llega con el cierre del mes.</p>';

  return envolver(`
    <h2>Fondos</h2>
    <p>Estos dos saldos no se reinician nunca. Son lo que queda cuando el mes se cierra.</p>

    <h3>Fondo de Ahorro · ${formatear(fondos?.FONDO_AHORRO?.saldoCents ?? 0)}</h3>
    ${lista(entradasAhorro)}

    <h3>Cartera de Inversión · ${formatear(fondos?.CARTERA_INVERSION?.saldoCents ?? 0)}</h3>
    ${lista(entradasCartera)}

    <div class="botones"><button class="btn" data-accion="cerrar-hoja">Cerrar</button></div>`);
}


/**

 * Sustituye al PIN y al anclaje mensual de saldo.
 */

  return `<div class="velo" style="align-items:center"><div class="hoja" data-parar style="border-radius:18px;margin:0 14px;max-width:420px">
    <h2 style="margin-top:10px">¿Cuánto ingresas al mes?</h2>
    <p>Lo pregunto una vez. A partir de ahí entra solo cada día 1 y se reparte en tus cuatro techos. No tendrás que teclear el saldo nunca más.</p>
    <div class="campo">
      <label for="alta-ingreso">Tu ingreso mensual normal</label>

  importeNoPositivo: (_args, mov) => !(mov.importeCents > 0),

  /** Importe absurdo: mas de N veces la mediana reciente. */
  importeAtipico: (args, mov, ctx) => {
    const mediana = ctx.medianaImporte ?? 0;
    if (mediana <= 0) return false;
    return mov.importeCents > mediana * args[0];

  /** El movimiento apunta a un periodo ya cerrado. */
  periodoCerrado: (_args, mov, ctx) => Boolean(ctx.periodosCerrados?.includes(mov.periodId)),

  /** Modifica o corrige un movimiento existente. */
  esCorreccion: (_args, mov) => Boolean(mov.corrigeA),

  /**
   * Hay al menos N movimientos previos a este bucket en las ultimas H horas.
   * Cuenta el actual, de ahi el >= en vez de >.

    const recientes = ctx.movimientosRecientes ?? [];
    const desde = (mov.ts ?? 0) - horas * 3_600_000;
    const n = recientes.filter(
      (m) => m.bucket === bucket && m.tipo === 'gasto' && m.ts >= desde && m.ts <= (mov.ts ?? 0),
    ).length;
    return n + 1 >= minimo;
  },

  /** Dia del mes del movimiento dentro de un rango. */
  diaEntre: (args, mov) => {
    const d = diaDeFecha(mov.localDate ?? '0000-00-00');
    return d >= args[0] && d <= args[1];

/**
 * Evalua un nodo del AST.
 * Un operador desconocido devuelve false en vez de lanzar: una regla rota no
 * puede impedir que el usuario registre un gasto.

  if (nodo == null) return false;
  if (typeof nodo === 'boolean') return nodo;
  const fn = OPERADORES[nodo.op];
  if (!fn) {
    if (ctx.onOperadorDesconocido) ctx.onOperadorDesconocido(nodo.op);
    return false;
  }
  return Boolean(fn(nodo.args ?? [], mov, ctx));
}

/**

 * Es lo que convierte un rechazo en una explicacion (§7.3).

  if (nodo.op === 'not') return [];
  if (!evaluar(nodo, mov, ctx)) return [];

  const a = nodo.args ?? [];
  switch (nodo.op) {
    case 'categoriaEn':

    case 'grupoEn':
      return [`pertenece al grupo «${a.join(' o ')}»`];
    case 'tagEn':
      return [`lleva la etiqueta «${a.join(' o ')}»`];
    case 'bucketEs':
      return [`lo estás guardando en ${a.join(' o ')}`];
    case 'comercioTipoEn':
      return [`el comercio es de tipo «${a.join(' o ')}»`];
    case 'fraccionDelTechoMayorQue':
      return [`supera el ${Math.round(a[0] * 100)} % del techo`];
    case 'fechaFutura':
      return ['la fecha es posterior a hoy'];
    case 'importeAtipico':
      return [`el importe es ${a[0]}× mayor de lo habitual`];
    case 'periodoCerrado':
      return ['el mes ya está cerrado'];
    case 'conteoRecienteAlMenos':
      return [`es el ${a[2]}.º movimiento a ${a[0]} en ${a[1]} h`];

}

  __e.evaluar = evaluar;
  __e.explicar = explicar;
  __e.OPERADORES = OPERADORES;
